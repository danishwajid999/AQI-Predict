name: Daily AQI Training Pipeline

on:
  schedule:
    # Runs once a day at 03:00 UTC (adjust if you want a different time)
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from GitHub's UI, for testing

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run training pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python training_pipeline.py