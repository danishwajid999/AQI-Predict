name: Hourly AQI Feature Pipeline

on:
  schedule:
    # Runs at minute 0 of every hour (UTC time)
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from GitHub's UI, for testing

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feature pipeline
        env:
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python feature_pipeline.py